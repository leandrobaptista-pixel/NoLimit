
name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify the official production target
        shell: bash
        env:
          EXPECTED_REPOSITORY: leandrobaptista-pixel/NoLimit
          EXPECTED_BRANCH: main
          EXPECTED_PAGES_PROJECT: nolimitcontractor
          EXPECTED_DOMAIN: nolimitcontractor.net
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "${EXPECTED_PAGES_PROJECT}" = "nolimitcontractor"
          test "${EXPECTED_DOMAIN}" = "nolimitcontractor.net"
          printf 'Publishing %s/%s to %s (%s)\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            "${EXPECTED_PAGES_PROJECT}" "${EXPECTED_DOMAIN}"

      - name: Validate Cloudflare file limit (25 MiB)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t oversized < <(find . -type f -size +25M ! -path './.git/*')
          if [ "${#oversized[@]}" -gt 0 ]; then
            echo "Cloudflare Pages limit is 25 MiB per file."
            printf ' - %s\n' "${oversized[@]}"
            exit 1
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@4.71.0

      - name: Stamp this release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .well-known
          printf '{"commit":"%s","run_id":"%s","deployed_at":"%s"}\n' \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .well-known/nolimit-release.json

      - name: Normalize Cloudflare credentials
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' '47f6c1dee23ca2adee98043a07a5cd23' | tr -d '\r\n')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | LC_ALL=C grep -q '[^!-~]'; then
            echo "CLOUDFLARE_API_TOKEN contains invalid characters after whitespace cleanup."
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name=nolimitcontractor --branch=main

      - name: Verify Pages release propagation
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          url="https://nolimitcontractor.pages.dev/.well-known/nolimit-release.json?run=${GITHUB_RUN_ID}"
          actual=""
          for attempt in {1..12}; do
            actual="$(curl --fail --silent --show-error --max-time 30 "$url" | jq -r '.commit // empty' || true)"
            if [ "$actual" = "$expected" ]; then
              echo "Pages fingerprint confirmed on attempt $attempt."
              exit 0
            fi
            echo "Pages release has not propagated yet (attempt $attempt/12); waiting 5 seconds."
            sleep 5
          done
          echo "::error title=Pages release did not propagate::Expected $expected; received ${actual:-no release fingerprint}."
          exit 1

      - name: Verify custom-domain release propagation
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          url="https://nolimitcontractor.net/.well-known/nolimit-release.json?run=${GITHUB_RUN_ID}"
          actual=""
          for attempt in {1..12}; do
            actual="$(curl --fail --silent --show-error --max-time 30 "$url" | jq -r '.commit // empty' || true)"
            if [ "$actual" = "$expected" ]; then
              echo "Custom-domain fingerprint confirmed on attempt $attempt."
              exit 0
            fi
            echo "Custom-domain release has not propagated yet (attempt $attempt/12); waiting 5 seconds."
            sleep 5
          done
          echo "::error title=Custom-domain release did not propagate::Expected $expected; received ${actual:-no release fingerprint}."
          exit 1

      - name: Smoke-test the public entry points
        shell: bash
        run: |
          set -euo pipefail
          base="https://nolimitcontractor.net"
          paths=("/" "/catalogs.html" "/viewer.html" "/no-limit-admin-beta/")
          for path in "${paths[@]}"; do
            status="$(curl --location --silent --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 3 --max-time 30 "${base}${path}?release=${GITHUB_RUN_ID}")"
            if [ "$status" != "200" ]; then
              echo "::error title=Public entry point failed::$path returned HTTP $status."
              exit 1
            fi
          done

      - name: Verify cache policy for document entry points
        shell: bash
        run: |
          set -euo pipefail
          for path in / /catalogs.html /no-limit-admin-beta/; do
            headers="$(curl --location --silent --show-error --head --max-time 30 "https://nolimitcontractor.net${path}?release=${GITHUB_RUN_ID}")"
            if ! printf '%s\n' "$headers" | grep -Eqi '^cache-control:.*(no-cache|max-age=0|must-revalidate)'; then
              echo "::error title=Document cache policy missing::$path is not returning a document revalidation policy."
              exit 1
            fi
          done
