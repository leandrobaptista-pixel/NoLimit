
name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify the official production target
        shell: bash
        env:
          EXPECTED_REPOSITORY: leandrobaptista-pixel/NoLimit
          EXPECTED_BRANCH: main
          EXPECTED_PAGES_PROJECT: nolimitcontractor
          EXPECTED_DOMAIN: nolimitcontractor.net
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "${EXPECTED_PAGES_PROJECT}" = "nolimitcontractor"
          test "${EXPECTED_DOMAIN}" = "nolimitcontractor.net"
          printf 'Publishing %s/%s to %s (%s)\n' "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${EXPECTED_PAGES_PROJECT}" "${EXPECTED_DOMAIN}"

      - name: Validate Cloudflare file limit (25 MiB)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t oversized < <(find . -type f -size +25M ! -path './.git/*')
          if [ "${#oversized[@]}" -gt 0 ]; then
            printf ' - %s\n' "${oversized[@]}"
            exit 1
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@4.71.0

      - name: Stamp this release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .well-known
          printf '{"commit":"%s","run_id":"%s","deployed_at":"%s"}\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .well-known/nolimit-release.json

      - name: Normalize Cloudflare credentials
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' '47f6c1dee23ca2adee98043a07a5cd23' | tr -d '\r\n')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | LC_ALL=C grep -q '[^!-~]'; then
            echo "CLOUDFLARE_API_TOKEN contains invalid characters."
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name=nolimitcontractor --branch=main

      - name: Verify Pages release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          actual="$(curl --fail --silent --show-error --retry 5 --retry-delay 4 --max-time 30 "https://nolimitcontractor.pages.dev/.well-known/nolimit-release.json?run=${GITHUB_RUN_ID}" | jq -r '.commit // empty')"
          test "$actual" = "$expected"

      - name: Audit custom-domain release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          actual="$(curl --fail --silent --show-error --retry 5 --retry-delay 4 --max-time 30 "https://nolimitcontractor.net/.well-known/nolimit-release.json?run=${GITHUB_RUN_ID}" | jq -r '.commit // empty')"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Custom domain is serving a different release::Expected ${expected}; received ${actual:-no release fingerprint}."
            exit 1
          fi

      - name: Smoke-test the public entry points
        shell: bash
        run: |
          set -euo pipefail
          base="https://nolimitcontractor.net"
          for path in / /catalogs.html /viewer.html /no-limit-admin-beta/; do
            status="$(curl --location --silent --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 3 --max-time 30 "${base}${path}?release=${GITHUB_RUN_ID}")"
            test "$status" = "200"
          done

      - name: Verify cache policy for document entry points
        shell: bash
        run: |
          set -euo pipefail
          for path in / /catalogs.html /no-limit-admin-beta/; do
            headers="$(curl --location --silent --show-error --head --max-time 30 "https://nolimitcontractor.net${path}?release=${GITHUB_RUN_ID}")"
            printf '%s\n' "$headers" | grep -qi '^cache-control:.*no-cache'
          done
