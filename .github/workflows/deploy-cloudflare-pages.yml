name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify the official production target
        shell: bash
        env:
          EXPECTED_REPOSITORY: leandrobaptista-pixel/NoLimit
          EXPECTED_BRANCH: main
          EXPECTED_PAGES_PROJECT: nolimitcontractor
          EXPECTED_DOMAIN: nolimitcontractor.net
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "${EXPECTED_PAGES_PROJECT}" = "nolimitcontractor"
          test "${EXPECTED_DOMAIN}" = "nolimitcontractor.net"
          printf 'Publishing %s/%s to %s (%s)\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            "${EXPECTED_PAGES_PROJECT}" "${EXPECTED_DOMAIN}"

      - name: Validate Cloudflare file limit (25 MiB)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t oversized < <(find . -type f -size +25M ! -path './.git/*')
          if [ "${#oversized[@]}" -gt 0 ]; then
            echo "Cloudflare Pages limit is 25 MiB per file."
            echo "Reduce these files before deploy:"
            printf ' - %s\n' "${oversized[@]}"
            exit 1
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@4.71.0

      - name: Stamp this release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .well-known
          # The Admin entry document is revalidated. Give its three executable
          # assets an immutable release fingerprint so a browser can never reuse
          # a prior Admin bundle after a successful deployment.
          sed -i "s/__RELEASE__/${GITHUB_SHA}/g" no-limit-admin-beta/index.html
          cat > .well-known/nolimit-release.json <<EOF
          {"commit":"${GITHUB_SHA}","run_id":"${GITHUB_RUN_ID}","deployed_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF

      - name: Normalize Cloudflare credentials
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' '47f6c1dee23ca2adee98043a07a5cd23' | tr -d '\r\n')"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if printf '%s' "$CLOUDFLARE_API_TOKEN" | LC_ALL=C grep -q '[^!-~]'; then
            echo "CLOUDFLARE_API_TOKEN still contains invalid characters after whitespace cleanup."
            echo "Recreate the GitHub secret by pasting the raw Cloudflare token as a single line without quotes."
            exit 1
          fi

          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name=nolimitcontractor --branch=main

      - name: Verify Pages release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          actual=""
          # Pages can accept a deployment before every edge location serves the
          # new static fingerprint. Poll the comparison itself (not only curl
          # transport retries), and retain expected/received values on failure.
          for attempt in {1..12}; do
            actual="$(curl --fail --silent --show-error --max-time 30 \
              "https://nolimitcontractor.pages.dev/.well-known/nolimit-release.json?run=${GITHUB_RUN_ID}" \
              | jq -r '.commit // empty' || true)"
            if [ "$actual" = "$expected" ]; then
              printf 'Pages release verified on attempt %s: %s\\n' "$attempt" "$actual"
              break
            fi
            printf 'Pages release pending (attempt %s/12): expected %s, received %s\\n' \
              "$attempt" "$expected" "${actual:-no release fingerprint}"
            sleep 5
          done
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Pages release did not propagate::Expected ${expected}; received ${actual:-no release fingerprint}."
            exit 1
          fi

      - name: Audit custom-domain release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          actual=""
          # Apply the same bounded propagation audit to the public domain.
          # A release is never approved merely because the Pages deployment
          # command returned successfully.
          for attempt in {1..12}; do
            actual="$(curl --fail --silent --show-error --max-time 30 \
              "https://nolimitcontractor.net/.well-known/nolimit-release.json?run=${GITHUB_RUN_ID}" \
              | jq -r '.commit // empty' || true)"
            if [ "$actual" = "$expected" ]; then
              printf 'Custom-domain release verified on attempt %s: %s\\n' "$attempt" "$actual"
              break
            fi
            printf 'Custom-domain release pending (attempt %s/12): expected %s, received %s\\n' \
              "$attempt" "$expected" "${actual:-no release fingerprint}"
            sleep 5
          done
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Custom domain is serving a different release::Expected ${expected}; received ${actual:-no release fingerprint}. Check the Cloudflare Pages custom-domain mapping, redirects, and cache rules."
            exit 1
          fi

      - name: Smoke-test the public entry points
        shell: bash
        run: |
          set -euo pipefail
          base="https://nolimitcontractor.net"
          paths=(
            "/"
            "/catalogs.html"
            "/viewer.html"
            "/no-limit-admin-beta/"
          )

          for path in "${paths[@]}"; do
            url="${base}${path}?release=${GITHUB_RUN_ID}"
            status="$(curl --location --silent --output /dev/null --write-out '%{http_code}' \
              --retry 3 --retry-delay 3 --max-time 30 "$url")"
            if [ "$status" != "200" ]; then
              echo "::error title=Public entry point failed::${path} returned HTTP ${status}."
              exit 1
            fi
          done

      - name: Verify released Admin asset fingerprints
        shell: bash
        run: |
          set -euo pipefail
          base="https://nolimitcontractor.net/no-limit-admin-beta"
          index="$(curl --fail --silent --show-error --retry 5 --retry-delay 4 --max-time 30 \
            "${base}/?release=${GITHUB_RUN_ID}")"
          for asset in styles.css vendor/supabase-js.min.js app.js; do
            printf '%s' "$index" | grep -Fq "${asset}?v=${GITHUB_SHA}"
            curl --fail --silent --show-error --retry 5 --retry-delay 4 --max-time 30 \
              "${base}/${asset}?v=${GITHUB_SHA}" > /dev/null
          done
