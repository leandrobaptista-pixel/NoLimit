name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Cloudflare file limit (25 MiB)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t oversized < <(find . -type f -size +25M ! -path './.git/*')
          if [ "${#oversized[@]}" -gt 0 ]; then
            echo "Cloudflare Pages limit is 25 MiB per file."
            echo "Reduce these files before deploy:"
            printf ' - %s\n' "${oversized[@]}"
            exit 1
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@4.71.0

      - name: Normalize Cloudflare credentials
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' '47f6c1dee23ca2adee98043a07a5cd23' | tr -d '\r\n')"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if printf '%s' "$CLOUDFLARE_API_TOKEN" | LC_ALL=C grep -q '[^!-~]'; then
            echo "CLOUDFLARE_API_TOKEN still contains invalid characters after whitespace cleanup."
            echo "Recreate the GitHub secret by pasting the raw Cloudflare token as a single line without quotes."
            exit 1
          fi

          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name=nolimitcontractor --branch=main
