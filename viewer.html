<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Viewer - A No Limit Carpentry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/homepage-preview.css?v=20260909-all-site-photos" />
    <style>
      body.viewer-page { background: var(--paper); color: var(--ink); font-family: "DM Sans", sans-serif; }
      .viewer-wrap { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
      .viewer-header { display: flex; justify-content: center; align-items: center; min-height: 88px; padding: 8px 72px 8px 22px; border-bottom: 1px solid var(--line); background: rgba(255,253,249,.95); }
      .viewer-header .brand { display: flex; align-items: center; gap: 10px; }
      .viewer-header img { width:76px; height:54px; object-fit:contain; }
      .viewer-header strong { font:300 1.55rem/1 "Newsreader", Georgia, serif; letter-spacing:-.04em; }
      .viewer-main { display: grid; place-items: center; padding: 34px 22px 96px; background: var(--ivory); }
      .viewer-main img { max-width: min(1100px,94vw); max-height: calc(100vh - 224px); border-radius: 0; box-shadow: none; cursor: zoom-out; }
      .viewer-footer { display: flex; justify-content: center; align-items: center; padding: 15px 22px 22px; color: var(--soft); font-weight:300; background:var(--ivory); }
      .viewer-actions { position: fixed; bottom: 22px; right: 22px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
      .viewer-actions a,
      .viewer-actions button { background: var(--paper); color: var(--ink); border: 1px solid var(--bronze); padding: 10px 14px; border-radius: 0; cursor: pointer; font:400 .95rem/1 "Newsreader",Georgia,serif; }
      .viewer-actions a:hover,.viewer-actions button:hover { background:var(--ink); border-color:var(--ink); color:#fff; }
      .viewer-actions button[disabled] { opacity: .45; cursor: default; }
      .viewer-close {
        position: fixed;
        top: 20px;
        right: 22px;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius:0;
        background: var(--paper);
        color: var(--ink);
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
        z-index: 3;
      }
      @media (max-width: 720px) {
        .viewer-header { min-height:76px; padding-right:64px; }
        .viewer-header img{width:66px;height:48px}.viewer-header strong{font-size:1.3rem}
        .viewer-main{padding:20px 14px 132px}.viewer-main img{max-width:100%;max-height:calc(100vh - 238px)}
        .viewer-actions { left: 14px; right: 14px; bottom:14px; gap:8px; }
        .viewer-actions a,
        .viewer-actions button { flex: 1 1 140px; justify-content: center; }
        .viewer-close{top:17px;right:14px}
      }
    </style>
  </head>
  <body class="viewer-page">
    <div class="viewer-wrap">
      <button id="closeViewerBtn" class="viewer-close" type="button" aria-label="Close viewer">×</button>
      <header class="viewer-header">
        <a class="brand" href="index.html">
          <img id="viewerBrandLogo" src="assets/brand-kit/no-limit-carpentry-nl-monogram.png" alt="NL monogram" />
          <strong id="viewerBrandName">No Limit Carpentry</strong>
        </a>
      </header>
      <main class="viewer-main">
        <img id="photo" alt="Project photo" />
      </main>
      <footer class="viewer-footer">
        <span id="meta"></span>
      </footer>
      <div class="viewer-actions">
        <button id="prevBtn" type="button">Previous</button>
        <button id="nextBtn" type="button">Next</button>
        <a id="backLink">Back to gallery</a>
        <button id="closeViewerAction" type="button">Close</button>
      </div>
    </div>
    <script src="assets/gallery-manifest.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const raw = decodeURIComponent(params.get('img') || '');
      const cat = params.get('cat') || '';
      const initialIndex = Number(params.get('i') || 0);

      const photo = document.getElementById('photo');
      const meta = document.getElementById('meta');
      const backLink = document.getElementById('backLink');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const viewerBrandLogo = document.getElementById('viewerBrandLogo');
      const viewerBrandName = document.getElementById('viewerBrandName');
      const closeViewerBtn = document.getElementById('closeViewerBtn');
      const closeViewerAction = document.getElementById('closeViewerAction');

      const toURL = (p) => {
        const value = String(p || '').trim();
        if (!value) return '';
        if (/^(?:[a-z]+:)?\/\//i.test(value) || value.startsWith('data:') || value.startsWith('blob:')) return value;
        return value.split('/').map(encodeURIComponent).join('/');
      };

      function getStoredSettings() {
        try {
          const rawSettings = localStorage.getItem('websiteSiteSettings');
          const parsed = JSON.parse(rawSettings || '{}');
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch {
          return {};
        }
      }

      function getStoredCategoryLabel() {
        if (!cat) return '';
        try {
          return localStorage.getItem(`galleryCategoryLabel:${cat}`) || '';
        } catch {
          return '';
        }
      }

      function applyViewerSettings() {
        const settings = getStoredSettings();
        if (settings.companyName && viewerBrandName) {
          viewerBrandName.textContent = settings.companyName;
        }
      }

      function getStoredList() {
        if (!cat) return [];
        try {
          const rawList = localStorage.getItem(`galleryList:${cat}`);
          const parsed = JSON.parse(rawList || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      async function getManifestList() {
        if (!cat) return [];
        if (window.GALLERY_MANIFEST && Array.isArray(window.GALLERY_MANIFEST[cat])) {
          return window.GALLERY_MANIFEST[cat];
        }
        try {
          const resp = await fetch(`assets/gallery-manifest.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!resp.ok) return [];
          const data = await resp.json();
          const list = data?.[cat];
          return Array.isArray(list) ? list : [];
        } catch {
          return [];
        }
      }

      function updateBackLink() {
        const url = new URL('index.html', location.href);
        if (cat) url.searchParams.set('cat', cat);
        url.hash = 'gallery';
        backLink.href = url.toString();
      }

      function closeViewer() {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = backLink.href;
      }

      function render(list, index) {
        const safeIndex = Math.max(0, Math.min(index, list.length - 1));
        const current = list[safeIndex] || raw;
        const categoryLabel = getStoredCategoryLabel() || cat;

        photo.src = toURL(current);
        photo.onerror = () => { photo.src = 'assets/placeholder.svg'; };

        const posText = list.length ? ` (${safeIndex + 1}/${list.length})` : '';
        meta.textContent = categoryLabel ? `Segment: ${categoryLabel}${posText} · Tap the photo or use X to return.` : `Photo${posText} · Tap the photo or use X to return.`;
        document.title = `Photo Viewer - ${categoryLabel || 'A No Limit'}`;

        prevBtn.disabled = list.length <= 1;
        nextBtn.disabled = list.length <= 1;

        const url = new URL(location.href);
        url.searchParams.set('img', current);
        if (cat) url.searchParams.set('cat', cat);
        url.searchParams.set('i', String(safeIndex));
        history.replaceState({ i: safeIndex }, '', url.toString());

        return safeIndex;
      }

      (async function init() {
        applyViewerSettings();
        updateBackLink();

        let list = getStoredList();
        if (!list.length) list = await getManifestList();
        if (!list.length && raw) list = [raw];

        let currentIndex = initialIndex;
        if (raw) {
          const found = list.indexOf(raw);
          if (found >= 0) currentIndex = found;
        }

        currentIndex = render(list, currentIndex);

        prevBtn.addEventListener('click', () => {
          if (list.length <= 1) return;
          currentIndex = (currentIndex - 1 + list.length) % list.length;
          currentIndex = render(list, currentIndex);
        });

        nextBtn.addEventListener('click', () => {
          if (list.length <= 1) return;
          currentIndex = (currentIndex + 1) % list.length;
          currentIndex = render(list, currentIndex);
        });

        closeViewerBtn.addEventListener('click', closeViewer);
        closeViewerAction.addEventListener('click', closeViewer);
        photo.addEventListener('click', closeViewer);

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            closeViewer();
            return;
          }
          if (event.key === 'ArrowLeft') prevBtn.click();
          if (event.key === 'ArrowRight') nextBtn.click();
        });
      })();
    </script>
    <script src="assets/photo-harmony.js?v=20260909-all-site-photos"></script>
  </body>
</html>
